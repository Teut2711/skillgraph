[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgraph-py"
version = "0.1.0"
description = "Knowledge compiler for agent skill repositories: source-authoritative graph index."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Teut2711", email = "manglavishesh64@gmail.com" }
]
keywords = ["llm", "agent", "skills", "graph", "index", "retrieval", "rag", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reactpy>=1.1",
    "starlette>=0.41,<0.49",
]
treesitter = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-sql>=0.1",
    "tree-sitter-markdown>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pylint>=3.0",
    "build>=1.2",
    "twine>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reactpy>=1.1",
    "starlette>=0.41,<0.49",
]

[project.scripts]
skillgraph = "skillgraph.cli:main"

[project.urls]
Homepage = "https://github.com/Teut2711/skillgraph"
Documentation = "https://Teut2711.github.io/skillgraph"
Repository = "https://github.com/Teut2711/skillgraph"
"Bug Tracker" = "https://github.com/Teut2711/skillgraph/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillgraph*"]

[tool.setuptools.package-data]
skillgraph = [
    "data/queries/*.scm",
    "data/skill/SKILL.md",
    "data/skill/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=skillgraph --cov-report=term-missing"
markers = [
    "unit: fast isolated tests",
    "integration: slower integration tests",
]

[tool.coverage.run]
source = ["skillgraph"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 12
max-locals = 30

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "duplicate-code",
    "import-outside-toplevel",
    "broad-exception-caught",
    "invalid-name",
]
